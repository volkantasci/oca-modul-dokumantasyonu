  - "4. Analitik, Bütçe ve Raporlama":
      - "Analitik Dağıtım Kuralları (analytic stack)": moduller/analytic_stack.md
      - "Bütçe Yönetimi (account_budget_oca)": moduller/account_budget_oca.md
      - "MIS Rapor Tasarımcısı (mis_builder)": moduller/mis_builder.md
  - "5. Faturalama Akışları":
      - "Gelişmiş Ödeme Vadeleri (account_payment_term_extension)": moduller/account_payment_term_extension.md
      - "İskonto Yönetimi (discounts)": moduller/discounts.md
      - "Sevkiyattan Fatura (stock_picking_invoicing)": moduller/stock_picking_invoicing.md
